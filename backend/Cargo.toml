[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
dotenv = "0.15.0"
hyper = { version = "1.8.1", features = ["full"] }
rune = "0.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "macros", "bigdecimal"] }
tokio = { version = "1.48.0", features = ["full"] }
tower = "0.5.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
