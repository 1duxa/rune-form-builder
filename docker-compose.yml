version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: formeditor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: formeditor
    ports:
      - "5432:5432"
    volumes:
      - formeditor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: formeditor-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  formeditor_pgdata:
    driver: local
